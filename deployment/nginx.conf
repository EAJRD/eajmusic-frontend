# ===========================================
# EAJMUSIC - NGINX CONFIGURATION
# ===========================================
# Guia de configuracion para tu servidor VPS. Adapta rutas y dominios.
#
# IMPORTANTE sobre la arquitectura: el frontend es un SOLO build (dist/)
# que sirve las 3 fachadas (marketing, artista, admin). La propia app de
# React detecta el subdominio en tiempo de ejecucion (ver
# src/utils/subdomain.ts) y decide que mostrar en la ruta raiz "/" - por
# eso las 3 server blocks de abajo apuntan al MISMO root y NO redirigen a
# /dashboard ni /admin (esas rutas solo existen en el dominio principal
# como fallback).

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name eajmusic.com www.eajmusic.com artist.eajmusic.com eaj.eajmusic.com api.eajmusic.com;
    return 301 https://$host$request_uri;
}

# Landing / Marketing (eajmusic.com) - also serves /dashboard and /admin
# as path-based fallbacks for anyone who bookmarked the old URLs.
server {
    listen 443 ssl http2;
    server_name www.eajmusic.com eajmusic.com;

    # SSL certificates (Let's Encrypt recommended)
    ssl_certificate /etc/letsencrypt/live/eajmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eajmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/eajmusic/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Artist Portal (artist.eajmusic.com) - same build, app renders the
# artist dashboard at "/" because it detects this hostname.
server {
    listen 443 ssl http2;
    server_name artist.eajmusic.com;

    ssl_certificate /etc/letsencrypt/live/eajmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eajmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/eajmusic/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Distributor Admin Portal (eaj.eajmusic.com) - same build, app renders
# the admin dashboard at "/" because it detects this hostname.
server {
    listen 443 ssl http2;
    server_name eaj.eajmusic.com;

    ssl_certificate /etc/letsencrypt/live/eajmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eajmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # IP Whitelist (OPCIONAL - descomentar para restringir acceso al staff)
    # allow TU_IP_AQUI;
    # deny all;

    root /var/www/eajmusic/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API Backend (api.eajmusic.com)
server {
    listen 443 ssl http2;
    server_name api.eajmusic.com;

    ssl_certificate /etc/letsencrypt/live/eajmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eajmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Max upload size (50MB for audio files)
    client_max_body_size 50M;

    # CORS is handled entirely by the Express app (server/src/index.js,
    # via the CORS_ORIGINS env var) so its per-origin allowlist actually
    # works. Do NOT also add Access-Control-Allow-Origin headers here -
    # a proxy adding its own CORS headers on top produces duplicate
    # headers that browsers reject the response for.
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static uploads (if serving files from backend instead of S3-compatible storage)
    location /uploads {
        alias /var/www/eajmusic/server/uploads;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
