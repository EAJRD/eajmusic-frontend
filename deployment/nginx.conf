# ===========================================
# EAJMUSIC - NGINX CONFIGURATION
# ===========================================
# Este archivo es una guia de configuracion para tu servidor
# Adapta las rutas y dominios a tu configuracion

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name eajmusic.com www.eajmusic.com app.eajmusic.com admin.eajmusic.com api.eajmusic.com;
    return 301 https://$host$request_uri;
}

# Landing Page (www.eajmusic.com)
server {
    listen 443 ssl http2;
    server_name www.eajmusic.com eajmusic.com;

    # SSL certificates (Let's Encrypt recommended)
    ssl_certificate /etc/letsencrypt/live/eajmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eajmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Frontend static files
    root /var/www/eajmusic/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Artist Portal (app.eajmusic.com)
server {
    listen 443 ssl http2;
    server_name app.eajmusic.com;

    ssl_certificate /etc/letsencrypt/live/eajmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eajmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/eajmusic/dist;
    index index.html;

    # Redirect root to /dashboard
    location = / {
        return 301 /dashboard;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Admin Portal (admin.eajmusic.com)
server {
    listen 443 ssl http2;
    server_name admin.eajmusic.com;

    ssl_certificate /etc/letsencrypt/live/eajmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eajmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # IP Whitelist (OPCIONAL - descomentar para restringir acceso)
    # allow TU_IP_AQUI;
    # deny all;

    root /var/www/eajmusic/dist;
    index index.html;

    # Redirect root to /admin
    location = / {
        return 301 /admin;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API Backend (api.eajmusic.com)
server {
    listen 443 ssl http2;
    server_name api.eajmusic.com;

    ssl_certificate /etc/letsencrypt/live/eajmusic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eajmusic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Max upload size (50MB for audio files)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # CORS headers (if needed)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Session-Id" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Static uploads (if serving files from backend)
    location /uploads {
        alias /var/www/eajmusic/server/uploads;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
