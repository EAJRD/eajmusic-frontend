[auth]
allowed_redirect_urls = ["http://localhost:5173/dashboard", "http://localhost:5173/login", "https://artist.eajmusic.com/dashboard", "https://artist.eajmusic.com/login", "https://eaj.eajmusic.com/dashboard", "https://eaj.eajmusic.com/login", "https://eajmusic.com/login", "https://eajmusic.com/dashboard"]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 8
require_number = true
require_lowercase = true
require_uppercase = true
require_special_char = true

[auth.smtp]
enabled = true
host = "smtp.hostinger.com"
port = 465
username = "ernesto@eajmusic.com"
sender_email = "no-reply@Eajmusic.com"
sender_name = "EAJMusic"
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
