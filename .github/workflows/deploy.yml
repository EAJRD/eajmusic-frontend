name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (main + artist + eaj)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api-api.eajmusic.com/api' }}

      - name: Package build
        # dist/ now contains three independent builds (main/, artist/, eaj/) —
        # see package.json's build:main/build:artist/build:eaj scripts.
        run: tar -czf /tmp/eajmusic-build.tar.gz -C dist .

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete snapshot --cleanup-tag --yes 2>/dev/null || true
          gh release create snapshot \
            --target "${{ github.sha }}" \
            --title "Snapshot $(date -u +%Y-%m-%d-%H%M%S)" \
            --notes "Build from ${{ github.sha }}" \
            --prerelease \
            /tmp/eajmusic-build.tar.gz
