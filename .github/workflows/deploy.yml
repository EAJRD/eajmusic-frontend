name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api-api.eajmusic.com/api' }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to eajmusic.com
        run: |
          lftp -u "${{ secrets.HOSTINGER_USER }},${{ secrets.HOSTINGER_PASSWORD }}" \
            -e "set ftp:ssl-allow no; mirror -R --verbose dist/ ${{ secrets.HOSTINGER_MAIN_DIR }}; quit" \
            ${{ secrets.HOSTINGER_HOST }}

      - name: Deploy to artist.eajmusic.com
        run: |
          lftp -u "${{ secrets.HOSTINGER_USER }},${{ secrets.HOSTINGER_PASSWORD }}" \
            -e "set ftp:ssl-allow no; mirror -R --verbose dist/ ${{ secrets.HOSTINGER_ARTIST_DIR }}; quit" \
            ${{ secrets.HOSTINGER_HOST }}

      - name: Deploy to eaj.eajmusic.com
        run: |
          lftp -u "${{ secrets.HOSTINGER_USER }},${{ secrets.HOSTINGER_PASSWORD }}" \
            -e "set ftp:ssl-allow no; mirror -R --verbose dist/ ${{ secrets.HOSTINGER_ADMIN_DIR }}; quit" \
            ${{ secrets.HOSTINGER_HOST }}
