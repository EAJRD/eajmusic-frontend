name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (main + artist + eaj)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api-api.eajmusic.com/api' }}

      - name: Run unit tests (auth flow utils, password policy, ticket contract helpers)
        run: npm test

      # Report-only for now: the codebase has pre-existing type errors
      # (API contract/dashboard/wallet/release/analytics types) predating
      # this workflow. Blocking merges on them today would fail every PR,
      # including ones unrelated to those files. Once that backlog is
      # cleared, drop `continue-on-error` so this actually gates merges.
      - name: Typecheck (report-only until pre-existing errors are cleared)
        run: npm run typecheck
        continue-on-error: true
